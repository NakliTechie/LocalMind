name: Sync to Hugging Face Space

# Ships index.html plus every sibling file it loads at runtime. The Space is
# `sdk: static`, so anything not copied here 404s there. Keep the two lists
# below (paths: and RUNTIME_FILES) identical. To re-derive the list, walk the
# import graph from index.html:
#   grep -n "new URL('" index.html          # same-origin worker + engine URLs
#   grep -n "new URL('./" inference-worker.js   # real (non-blob) worker imports
# The Space's README.md is HF metadata; it is never copied or staged.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - inference-worker.js
      - lfm2_5.js
      - gemma-4-e2b.js
      - ternary_bonsai_2_27b.js
      - .github/workflows/sync-hf-space.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          RUNTIME_FILES="index.html inference-worker.js lfm2_5.js gemma-4-e2b.js ternary_bonsai_2_27b.js"
          git clone https://NakliTechie:$HF_TOKEN@huggingface.co/spaces/naklitechie/LocalMind /tmp/hf-space
          cp $RUNTIME_FILES /tmp/hf-space/
          cd /tmp/hf-space
          git config user.email "chirag@naklitechie.com"
          git config user.name "NakliTechie"
          git add $RUNTIME_FILES
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Sync from GitHub $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
