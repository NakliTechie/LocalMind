name: Sync to Hugging Face Space

# LocalMind ships as one file: every runtime module in src/ is rolled into
# index.html by scripts/roll-in.mjs, so index.html is the only file the Space
# needs. The Space is `sdk: static`. The step also removes the sibling .js files
# earlier syncs copied there, so the Space cannot serve a stale engine.
# The Space's README.md is HF metadata; it is never copied or staged.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/sync-hf-space.yml
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check index.html carries src/
        run: node scripts/roll-in.mjs --check

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          RETIRED="inference-worker.js lfm2_5.js gemma-4-e2b.js ple-opfs.js opfs-reader.js gguf.js ingest.js rows.js qwen3_moe_ssd.js qwen35_moe_ssd.js gemma4_moe_ssd.js moe-expert-stream.js ternary_bonsai_2_27b.js ternary_bonsai_2_dflash.js"
          git clone https://NakliTechie:$HF_TOKEN@huggingface.co/spaces/naklitechie/LocalMind /tmp/hf-space
          cp index.html /tmp/hf-space/
          cd /tmp/hf-space
          git config user.email "chirag@naklitechie.com"
          git config user.name "NakliTechie"
          git rm -q --ignore-unmatch $RETIRED
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Sync from GitHub $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
